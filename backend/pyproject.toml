[project]
name = "royd-backend"
version = "0.1.0"
description = "ROYD — Registrator Ofis Yagona Darcha Tizimi backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.1,<5",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.1.0",
    "aiosmtplib>=3.0.2",
    "jinja2>=3.1.4",
    "apscheduler>=3.10.4",
    "email-validator>=2.2.0",
    "openpyxl>=3.1.5",
    "segno>=1.6.1",
    "sentry-sdk[fastapi]>=2.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
    # In-memory database for the integration tests.
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# B008: FastAPI's Depends()/Query() in defaults is the framework's own idiom.
# RUF001: Uzbek copy legitimately uses en dashes and typographic apostrophes.
ignore = ["B008", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# Inline-styled email HTML: mail clients ignore <style>, so lines run long.
"app/services/email_templates.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
