name: CI

# Nothing checked the build before this: the frontend shipped with two
# TypeScript errors and the backend with 27 lint errors, and neither was
# noticed because no automation ever ran them (F-02).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check app tests

      - name: Ruff (format check)
        run: uv run ruff format --check app tests

      - name: mypy
        run: uv run mypy app
        continue-on-error: true # advisory until the existing gaps are typed

      - name: Pytest
        run: uv run pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint . --ext .ts,.tsx

      - name: Typecheck and build
        # `npm run build` runs `tsc -b` first, so this gates on both.
        run: npm run build

      - name: Check translation bundles are in sync
        run: node scripts/check-i18n.mjs

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/backend.Dockerfile
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
