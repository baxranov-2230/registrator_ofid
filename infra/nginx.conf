events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    limit_req_zone $binary_remote_addr zone=hemis:10m rate=10r/m;

    server {
        listen 80 default_server;
        server_name _;

        location = /healthz {
            proxy_pass http://royd_backend:8000;
            proxy_set_header Host $host;
            access_log off;
        }

        # Backend API
        location /api/ {
            proxy_pass http://royd_backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://royd_backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # HEMIS login proxy (browser CORS workaround).
        # Exactly one path, rate limited — the previous /hemis/ prefix exposed
        # the whole HEMIS API as an open anonymous proxy (B-09).
        location = /hemis/auth/login {
            limit_req zone=hemis burst=3 nodelay;
            if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }

            proxy_pass https://student.ndki.uz/rest/v1/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host student.ndki.uz;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_ssl_server_name on;
            proxy_read_timeout 20s;
        }

        # Frontend (Vite dev server + HMR WebSocket)
        location / {
            proxy_pass http://royd_frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }
    }
}
