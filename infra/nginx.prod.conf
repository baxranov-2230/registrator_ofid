events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Must stay >= the backend's MAX_UPLOAD_MB so the API returns a clean 413
    # rather than nginx dropping the connection.
    client_max_body_size 25M;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Rate limit zones. The HEMIS proxy is deliberately the tightest: it reaches
    # a third party's login endpoint, and an open proxy there gets our server's
    # IP blocked (B-09).
    limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=hemis:10m rate=10r/m;

    upstream backend  { server royd_backend:8000; }
    upstream frontend { server royd_frontend:8080; }

    # ── HTTP: ACME challenge only, everything else redirects to TLS ──────────
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name ${SERVER_NAME};

        ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers (E-02). The API sets its own too, so it stays
        # protected even when reached directly.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # 'unsafe-inline' styles are required by MUI's runtime CSS-in-JS.
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'" always;

        # Login endpoints get a much tighter budget than the rest of the API.
        location ~ ^/api/v1/auth/(login|refresh) {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_common.conf;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_common.conf;
            proxy_read_timeout 120s;
        }

        location /ws/ {
            proxy_pass http://backend;
            include /etc/nginx/proxy_common.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        location = /healthz {
            proxy_pass http://backend;
            include /etc/nginx/proxy_common.conf;
            access_log off;
        }

        # HEMIS browser flow. Only the single login path is exposed, rate
        # limited, and restricted to requests originating from our own app —
        # previously the whole HEMIS API was an open anonymous proxy (B-09).
        location = /hemis/auth/login {
            limit_req zone=hemis burst=3 nodelay;

            valid_referers server_names;
            if ($invalid_referer) { return 403; }
            if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }

            proxy_pass https://student.ndki.uz/rest/v1/auth/login;
            proxy_set_header Host student.ndki.uz;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_ssl_server_name on;
            proxy_read_timeout 20s;
        }

        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_common.conf;
        }
    }
}
